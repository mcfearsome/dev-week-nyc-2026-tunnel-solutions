name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save runner minutes. Pushes to main are NOT
# cancelled (cancel-in-progress=false for non-PR events): same-ref runs queue,
# which serializes the Fly deploy so two quick merges can't race flyctl against
# the single warm machine.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The integration tests self-bootstrap: they shell out to `cargo build -p <pkg>`
      # before spawning target/debug/{relay,tnls,tnls-demo,tnls-rendezvous}, so no pre-build step is needed.
      #
      # The rendezvous e2e (get_transfers_the_file_through_the_tunnel) drives a real
      # multi-process BitTorrent transfer over loopback and currently hangs on GitHub
      # runners (the getter's magnet metadata resolution never completes within the
      # timeout). Skip it in CI for now; run it locally with
      # `cargo test -p tnls-rendezvous --test end_to_end`.
      - run: cargo test --workspace --locked -- --skip get_transfers_the_file_through_the_tunnel

  audit:
    name: cargo audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: a new RustSec advisory should surface here without blocking
    # merges or the deploy. Promote to a required check later if desired.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deploy:
    name: deploy (fly.io)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    # Deploy only on a real push to main that passed fmt + clippy + tests.
    # PR events never reach here; audit is advisory and intentionally not a gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-fly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Builds the image on Fly's remote builder from the repo Dockerfile + fly.toml
      # (app "tunnel-locker"); no Docker daemon needed on the runner.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
