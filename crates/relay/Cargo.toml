[package]
name = "relay"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
futures-util.workspace = true
rocket = { version = "0.5.1", features = ["json"] }
rocket_ws = "0.1.1"
getrandom = "0.2"
async-trait = "0.1"
bytes = "1"
# rustls TLS + bundled webpki roots: rediss:// (Upstash etc.) works, and no system CA store
# is needed in the slim runtime container.
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

[dev-dependencies]
tokio-tungstenite = "0.23"
