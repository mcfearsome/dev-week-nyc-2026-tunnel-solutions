[package]
name = "rendezvous-gui"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native egui front-end for `tnls rendezvous`: send and receive files over capability-scoped BitTorrent tunnels."

[[bin]]
name = "tnls-rendezvous-gui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
tokio = { workspace = true }
anyhow = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
tnls-core = { path = "../tnls-core" }
tnls-tunnel = { path = "../tnls-tunnel" }
tnls-rendezvous = { path = "../plugins/rendezvous" }
