[package]
name = "tnls-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "tnls-demo"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1.7", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { workspace = true }
tnls-plugin = { path = "../../tnls-plugin" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
anyhow = { workspace = true }
