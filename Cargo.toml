[workspace]
resolver = "2"
members = ["crates/tunnel-locker-core", "crates/relay", "crates/tunnel-locker", "crates/mcp-demo", "crates/tnls"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "signal", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = "0.3"
